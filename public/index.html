    <h2 id="login-title" style="margin-top:0">Mentor Hub sign in</h2>
    <div id="google-login-box" hidden style="margin:14px 0">
      <div id="google-btn-container" style="display:flex;justify-content:center"></div>
      <div style="display:flex;align-items:center;margin:14px 0;gap:8px">
        <hr style="flex:1;border:none;border-top:1px solid var(--line)">
        <span class="m" style="font-size:12px">Or with credentials / أو بالحساب</span>
        <hr style="flex:1;border:none;border-top:1px solid var(--line)">
      </div>
    </div>
    <div id="demo-login-box">
      <label id="lu-lbl" class="m">Username or Email
        <input id="lu" type="text" placeholder="name@example.com" autocomplete="username">
      </label>
      <label id="lp-lbl" class="m" style="margin-top:12px">Password
        <div class="pw-wrap">
          <input id="lp" type="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" id="toggle-pw" class="pw-eye" aria-label="Toggle password visibility" title="Show/Hide Password">👁️</button>
        </div>
      </label>
      <button class="p" id="lg" style="width:100%;margin-top:16px">Sign in</button>
    </div>
    <div id="setup-password-box" hidden>
      <div style="background:var(--warnbg);border:1px solid var(--orange);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13.5px">
        <span>👋 Welcome, <b id="setup-name"></b>! Please create your password for the first time.</span>
        <div class="m" style="margin-top:4px">أهلاً بك! يرجى إنشاء وتأكيد كلمة مرور خاصة بحسابك لأول مرة.</div>
      </div>
      <label class="m">New password / كلمة المرور الجديدة
        <div class="pw-wrap">
          <input id="np1" type="password" placeholder="At least 6 characters" autocomplete="new-password">
          <button type="button" id="toggle-np1" class="pw-eye" aria-label="Toggle password">👁️</button>
        </div>
      </label>
      <label class="m" style="margin-top:12px">Confirm password / تأكيد كلمة المرور
        <div class="pw-wrap">
          <input id="np2" type="password" placeholder="Repeat password" autocomplete="new-password">
          <button type="button" id="toggle-np2" class="pw-eye" aria-label="Toggle password">👁️</button>
        </div>
      </label>
      <button class="p" id="save-pw-btn" style="width:100%;margin-top:16px">Save password & Sign in / حفظ ومتابعة</button>
      <button type="button" id="cancel-setup-btn" class="sm" style="width:100%;margin-top:8px">Back to sign in / رجوع</button>
    </div>
    <div id="le" class="bad" role="alert" style="margin-top:10px;text-align:center"></div>
  </div>
</div>
